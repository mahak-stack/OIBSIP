<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Temperature Converter</h1>
        <p>Convert temperatures with ease.</p>

        <div class="converter">

            <label for="temperature">Enter Temperature</label>
            <input type="number" id="temperature" placeholder="Enter temperature" step="any">

            <label for="unit">Select Temperature Unit</label>
            <select id="unit">
                <option value="celsius">Celsius (°C)</option>
                <option value="fahrenheit">Fahrenheit (°F)</option>
                <option value="kelvin">Kelvin (K)</option>
            </select>

            <button id="convertBtn">Convert Temperature</button>

            <button id="resetBtn" type="button">↻ Reset</button>

            <div id="temperatureIndicator">
                <span id="tempEmoji">🌡️</span>
                <p id="tempMessage">Ready to check the temperature!</p>
            </div>


            <div id="result">
                Your result will appear here.
            </div>

            <p id="error"></p>

        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
